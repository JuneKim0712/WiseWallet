<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>index.html</title>
  <!-- DON'T TOUCH THIS -->
  <script defer src="/__/firebase/11.0.1/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/11.0.1/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/11.0.1/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/init.js?useEmulator=true"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script type="module" defer src="js/transactions.js"></script>
  <script type="module" defer src="js/db.js"></script>
  <script type="module" defer src="js/preprocess.js"></script>
  <link defer rel="stylesheet" href="css/home.css">
  <link defer rel="stylesheet" href="css/nav.css">
  <!-- font import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!--  -->
</head>

<body>

  <nav
    class="appearance-none h-16 fixed flex items-center justify-center relative text-sm sm:text-base bg-neutral-100 border-2 mt-3"
    id="navigationBar">
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:rounded-md hover:bg-blue-300 inline-flex items-center"
      href="index.html">Home</a>
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:rounded-md hover:bg-blue-300 inline-flex items-center"
      href="">Finances</a>
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:rounded-md hover:bg-blue-300 inline-flex items-center"
      href="transactions.html">Transactions</a>
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:rounded-md hover:bg-blue-300 inline-flex items-center"
      href="">Summary</a>
    <button class="text-xl px-4 py-2 mx-14 hover:rounded-md hover:bg-blue-300 inline-flex items-center"
      id="signOutBtn"><a href="">Sign Out</a></button>
  </nav>
  <!-- modal -->
  <div id="editModal" class="hidden fixed inset-0 flex items-center justify-center bg-black/50">
    <div class="relative w-full max-w-md p-6 bg-white rounded-xl shadow-lg dark:bg-gray-800">
      <button id="closeEditModal"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white cursor-pointer">
        ✖
      </button>
      <h3 class="text-lg font-medium text-gray-700 dark:text-gray-300 text-center mb-4">Edit Transaction</h3>
      <form id="editTransactionForm" class="space-y-4">
        <input type="hidden" id="editTransactionId">

        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Amount:</label>
        <input type="number" id="editAmount"
          class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:text-white">

        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Category:</label>
        <select id="editCategory" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:text-white"></select>

        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Date:</label>
        <input type="date" id="editDate" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:text-white">

        <div class="flex justify-end gap-3">
          <button type="button" id="cancelEdit"
            class="px-5 py-2.5 bg-gray-300 rounded-lg dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-400 cursor-pointer">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>


  <div id="deleteModal" tabindex="-1" class="hidden fixed inset-0 flex items-center justify-center bg-black/50">
    <div class="relative w-full max-w-md p-6 bg-white rounded-xl shadow-lg dark:bg-gray-800">
      <button id="closeBtn" type="button"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white cursor-pointer">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1l6 6m0 0l6 6M7 7l6-6M7 7L1 13" />
        </svg>
      </button>
      <div class="text-center">
        <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <h3 class="mb-5 text-lg font-medium text-gray-700 dark:text-gray-300">Are you sure you want to delete?</h3>
        <div class="flex justify-center gap-3">
          <button id="confirmDelete"
            class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-300 dark:focus:ring-red-800 cursor-pointer">
            Yes, delete
          </button>
          <button id="cancelDelete"
            class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 cursor-pointer">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
  <br>
  <br>
  <br>
  <br>
  <select id="filterSelect">
    <option value="all">All Transactions</option>
    <option value="year">Last Year</option>
    <option value="month">Last Month</option>
    <option value="week">Last Week</option>
  </select>
  <br>
  <br>
  <input id="searchInput" placeholder="Search..." type="text">
  <br>
  <br>
  <table id="transactionTable" border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th align="left">Date</th>
        <th align="left">Amount</th>
        <th align="left">Category</th>
        <th align="left">Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Transactions will be listed here -->
    </tbody>
  </table>

  <table id="incomeTable" border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th align="left">Period</th>
        <th align="left">Amount</th>
        <th align="left">Category</th>
        <th align="left">Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Transactions will be listed here -->
    </tbody>
  </table>
  <table id="expenseTable" border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th align="left">Period</th>
        <th align="left">Amount</th>
        <th align="left">Category</th>
        <th align="left">Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Transactions will be listed here -->
    </tbody>
  </table>

</body>

</html>
