<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transactions</title>
    <script defer src="/__/firebase/11.0.1/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/11.0.1/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/11.0.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script type="module" defer src="js/transactions.js"></script>
    <script type="module" defer src="js/db.js"></script>
    <script type="module" defer src="js/preprocess.js"></script>
    <script type="module" defer src="js/plot.js"></script>
    <link defer rel="stylesheet" href="css/home.css">
    <link defer rel="stylesheet" href="css/nav.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="assets\favicon.svg">
    </head>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
          document.getElementById("body").classList.remove("hidden")
        })
      </script>
      
      <body id="body" class="bg-[#fffffa] font-[Montserrat] hidden">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-gray-200 p-10 h-16 flex items-center justify-between relative text-sm sm:text-base mt-3 font-semibold">
        <img src="assets/favicon.svg" class="h-15 w-15 transition-transform duration-300 hover:scale-105">
        <div class="flex justify-center flex-1 space-x-14">
            <a class="nav-link" href="home.html">Home</a>
            <a class="nav-link" href="charts.html">Charts</a>
            <a class="nav-link active" href="transactions.html">Transactions</a>
            <a class="nav-link" href="help.html">Support</a>
            <button class="sign-out-btn" id="signOutBtn">
                <a href="">Sign Out</a>
            </button>
        </div>
    </nav>

  <div id="addTransactionModal" 
    class="z-50 fixed inset-0 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white w-[600px] rounded-2xl shadow-2xl transform scale-95 transition-all duration-300">
      <div class="p-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-semibold text-gray-800">Add New Transaction</h2>
          <button id="closeTransactionModal" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Form Content -->
        <div class="space-y-6">
          <!-- Amount Field -->
          <div class="form-group">
            <label class="form-label">Transaction Amount</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">$</span>
              <input type="number" id="transactionAmount" 
                class="form-input w-full pl-8 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                placeholder="Enter amount" />
            </div>
          </div>

          <!-- Category Field -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
            <div class="custom-select relative w-full">
              <div class="selected-option p-3 border border-gray-300 rounded-lg cursor-pointer bg-white flex justify-between items-center hover:border-gray-400 transition-all">
                <span id="selectedCategory" class="text-gray-700">Select category</span>
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
              <div class="dropdown-menu hidden absolute w-full bg-white border rounded-lg shadow-lg z-50 mt-1">
                <div class="category-options max-h-64 overflow-y-auto">
                  <!-- Options will be populated by JavaScript -->
                </div>
              </div>
              <input type="hidden" id="transactionCategory">
            </div>
          </div>

          <!-- Date Field -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
            <input type="date" id="transactionDate" 
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
          </div>

          <!-- Hidden type field -->
          <input type="hidden" id="transactionType" />
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end space-x-3 mt-8">
          <button id="cancelTransaction" 
            class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-all duration-200">
            Cancel
          </button>
          <button id="saveTransaction" 
            class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all duration-200">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

    <div id="deleteModal" tabindex="-1" class="z-50 hidden fixed inset-0 flex items-center justify-center bg-black/50">
        <div class="relative w-full max-w-md p-6 bg-white rounded-xl shadow-lg dark:bg-gray-800">
            <button id="closeBtn" type="button"
                class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white cursor-pointer">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M1 1l6 6m0 0l6 6M7 7l6-6M7 7L1 13" />
                </svg>
            </button>
            <div class="text-center">
                <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <h3 class="mb-5 text-lg font-medium text-gray-700 dark:text-gray-300">Are you sure you want to
                    delete?</h3>
                <div class="flex justify-center gap-3">
                    <button id="confirmDelete"
                        class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-300 dark:focus:ring-red-800 cursor-pointer">
                        Yes, delete
                    </button>
                    <button id="cancelDelete"
                        class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 cursor-pointer">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex flex-wrap w-full mt-6">
        <div class="w-full p-4 ">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h5 class="text-xl font-semibold text-blue-gray-900">Income and Expenses</h5>
                    <p class="text-gray-700">Manage and track your income and expenses</p>
                </div>
            </div>

            <div class="flex gap-2 mb-4">
                <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1 shadow-sm">
                    <button id="filterSelect" 
                        class="relative px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 hover:bg-white/60 focus:outline-none" 
                        data-value="all">
                        <span class="relative z-10">All time</span>
                    </button>
                    <button id="filterSelect" 
                        class="relative px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 hover:bg-white/60 focus:outline-none" 
                        data-value="year">
                        <span class="relative z-10">Last year</span>
                    </button>
                    <button id="filterSelect" 
                        class="relative px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 hover:bg-white/60 focus:outline-none" 
                        data-value="month">
                        <span class="relative z-10">Last month</span>
                    </button>
                    <button id="filterSelect" 
                        class="relative px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 hover:bg-white/60 focus:outline-none" 
                        data-value="week">
                        <span class="relative z-10">Last week</span>
                    </button>
                </div>
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                        </svg>
                    </div>
                    <input id="searchInput" 
                        type="text" 
                        placeholder="Search transactions..." 
                        class="w-full pl-10 pr-4 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
            </div>
        </div>

        <div class="w-1/2 p-4 pr-5">
          <div class="flex items-center justify-between mb-4">
              <div>
                  <h5 class="text-xl font-semibold text-green-900">Incomes</h5>
                  <p class="text-gray-700">List of your incomes</p>
              </div>
              <button id="addTransactionBtn"
                  class="cursor-pointer bg-gray-900 py-2 px-4 text-xs font-bold uppercase text-white rounded-lg hover:shadow-lg focus:ring focus:ring-gray-500">
                  Add Income
              </button>
          </div>
          <div class="relative overflow-auto rounded-xl shadow-sm border border-gray-200 mb-4">
              <table id="incomeTable" class="w-full text-left table-fixed divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                      <tr>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors">Date</th>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors">Amount</th>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors">Category</th>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider w-1/8">Action</th>
                      </tr>
                  </thead>
                  <tbody id="incomeTableBody" class="bg-white divide-y divide-gray-200 text-sm">
                  </tbody>
              </table>
          </div>
          <div id="incomePagination" class="flex justify-center items-center mt-6 gap-4">
            <!-- Pagination controls will be inserted here by JavaScript -->
          </div>
      </div>

      <div class="w-1/2 p-4 pl-5">
          <div class="flex items-center justify-between mb-4">
              <div>
                  <h5 class="text-xl font-semibold text-red-900">Expenses</h5>
                  <p class="text-gray-700">List of your expenses</p>
              </div>
              <button id="addTransactionBtnExpense"
                  class="cursor-pointer bg-gray-900 py-2 px-4 text-xs font-bold uppercase text-white rounded-lg hover:shadow-lg focus:ring focus:ring-gray-500">
                  Add Expense
              </button>
          </div>
          <div class="relative overflow-auto rounded-xl shadow-sm border border-gray-200">
              <table id="expenseTable" class="w-full text-left table-fixed divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                      <tr>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors">Date</th>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors">Amount</th>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors">Category</th>
                          <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider w-1/8">Action</th>
                      </tr>
                  </thead>
                  <tbody id="expenseTableBody" class="bg-white divide-y divide-gray-200 text-sm">
                  </tbody>
              </table>
          </div>
          <div id="expensePagination" class="flex justify-center items-center mt-6 gap-4">
            <!-- Pagination controls will be inserted here by JavaScript -->
          </div>
      </div>
  </div>

</body>

</html>
