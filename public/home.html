<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>

  <!-- Firebase Imports -->
  <script defer src="/__/firebase/11.0.1/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/11.0.1/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/11.0.1/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/init.js?useEmulator=true"></script>

  <!-- Javascript Imports-->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" defer src="js/home.js"></script>
  <script type="module" defer src="js/db.js"></script>
  <script type="module" defer src="js/preprocess.js"></script>

  <!-- Tailwind Imports -->
  <script defer src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/nav.css">

  <!-- Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="assets/Transparent WW Logo.svg">
</head>

<body id="body" class="bg-[#fffffa] font-[Montserrat]">

  <!-- modal -->
  <div id="deleteModal" tabindex="-1" class="z-50 hidden fixed inset-0 flex items-center justify-center bg-black/50">
    <div class="relative w-full max-w-md p-6 bg-white rounded-xl shadow-lg dark:bg-gray-800">
      <button id="closeBtn" type="button"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white cursor-pointer">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1l6 6m0 0l6 6M7 7l6-6M7 7L1 13" />
        </svg>
      </button>
      <div class="text-center">
        <svg id="svg" class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <h3 class="mb-5 text-lg font-medium text-gray-700 dark:text-gray-300">Are you sure you want to delete?</h3>
        <div class="flex justify-center gap-3">
          <button id="confirmDelete"
            class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-300 dark:focus:ring-red-800 cursor-pointer">
            Yes, delete
          </button>
          <button id="cancelDelete"
            class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 cursor-pointer">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <nav
    class="p-10 appearance-none h-16 flex items-center justify-center relative text-sm sm:text-base mt-3 border-b-2 text-center font-semibold"
    id="navigationBar">
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:bg-gray-200 inline-flex items-center" href="home.html">Home</a>
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:bg-gray-200 inline-flex items-center" href="">Finances</a>
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:bg-gray-200 inline-flex items-center"
      href="transactions.html">Transactions</a>
    <a class="no-underline text-xl px-4 py-2 mx-14 hover:bg-gray-200 inline-flex items-center"
      href="help.html">Support</a>
    <button class="text-xl px-4 py-2 mx-14 hover:bg-gray-200 inline-flex items-center" id="signOutBtn"><a href="">Sign
        Out</a></button>
  </nav>

  <div class="flex flex-wrap w-full mt-6">

    <!-- Left Side: Cards and Graph -->
    <div class="w-1/2 flex flex-col space-y-4">

      <!-- Cards -->
      <div id="here" class="grid grid-cols-1 sm:grid-cols-3 gap-4 ml-4 p-6">
        <!-- Balance Card -->
        <div class="rounded-xl shadow-md overflow-hidden">
          <div class="bg-[#d5c7f7] p-4">
            <div class="text-black font-semibold text-lg flex items-center">
              <svg class="w-6 h-6 text-gray-800 dark:text-black" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 8H5m12 0a1 1 0 0 1 1 1v2.6M17 8l-4-4M5 8a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.6M5 8l4-4 4 4m6 4h-4a2 2 0 1 0 0 4h4a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1Z" />
              </svg>
              <div>&nbsp;&nbsp;</div>
              Balance
            </div>
          </div>
          <div class="bg-[#e3d7f9] p-8">
            <div id="balance" class="text-3xl font-bold text-gray-900">$1000</div>
          </div>
        </div>

        <!-- Income Card -->
        <div class="rounded-xl shadow-md overflow-hidden">
          <div class="bg-[#cfd8f7] p-4">
            <div class="text-black font-semibold text-lg flex items-center">
              <svg class="w-6 h-6 text-gray-800 dark:text-black" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4.5V19a1 1 0 0 0 1 1h15M7 14l4-4 4 4 5-5m0 0h-3.207M20 9v3.207" />
              </svg>
              <div>&nbsp;&nbsp;</div>
              Income
            </div>
          </div>
          <div class="bg-[#e0e6f9] p-8">
            <div id="income" class="text-3xl font-bold text-gray-900">$1000</div>
          </div>
        </div>

        <!-- Expenses Card -->
        <div class="rounded-xl shadow-md overflow-hidden">
          <div class="bg-[#bce5c5] p-4">
            <div class="text-black font-semibold text-lg flex items-center">
              <svg class="w-6 h-6 text-gray-800 dark:text-black" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4.5V19a1 1 0 0 0 1 1h15M7 10l4 4 4-4 5 5m0 0h-3.207M20 15v-3.207" />
              </svg>
              <div>&nbsp;&nbsp;</div>
              Expenses
            </div>
          </div>
          <div class="bg-[#d9f1e0] p-8">
            <div id="expenses" class="text-3xl font-bold text-gray-900">$1000</div>
          </div>
        </div>
      </div>

      <!-- Graph -->
      <div class="ml-4 p-6">
        <select class="w-2/9 mb-4 border-2 rounded-lg text-xl h-10 text-center" id="selectRangeHistory">
          <option value="all">All Transactions</option>
          <option value="year">Last Year</option>
          <option value="month">Last Month</option>
          <option value="week">Last Week</option>
        </select>
        <canvas id="balanceSummary"></canvas>
      </div>

    </div>

    <!-- Right Side: Table -->
    <div class="w-1/2 p-4 pr-5">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h5 class="text-xl font-semibold text-blue-gray-900">Transactions</h5>
          <p class="text-gray-700">Manage and track your transactions</p>
        </div>
        <button
          class="bg-gray-900 py-2 px-4 text-xs font-bold uppercase text-white rounded-lg hover:shadow-lg focus:ring focus:ring-gray-500">
          Add Transaction
        </button>
      </div>

      <div class="flex gap-2 mb-4">
        <div class="flex items-center gap-1 bg-gray-200 p-1 rounded-lg">
          <button id="filterSelect"
            class="py-2 px-4 text-xs font-bold uppercase rounded-lg hover:bg-gray-300 focus:bg-white"
            data-value="all">All</button>
          <button id="filterSelect"
            class="py-2 px-4 text-xs font-bold uppercase rounded-lg hover:bg-gray-300 focus:bg-white"
            data-value="year">1 Year</button>
          <button id="filterSelect"
            class="py-2 px-4 text-xs font-bold uppercase rounded-lg hover:bg-gray-300 focus:bg-white"
            data-value="month">1 Month</button>
          <button id="filterSelect"
            class="py-2 px-4 text-xs font-bold uppercase rounded-lg hover:bg-gray-300 focus:bg-white"
            data-value="week">1 Week</button>
        </div>
        <div class="relative flex-grow mr-0">
          <input id="searchInput" type="text" placeholder="Search" class="w-full h-10 px-3 border rounded-lg">
        </div>
      </div>

      <div class="relative overflow-auto">
        <table id="transactionTable"
          class="w-full text-left table-fixed border border-gray-300 rounded-2xl overflow-hidden">
          <thead class="bg-gray-100 rounded-lg">
            <tr>
              <th class="p-4 cursor-pointer">Date</th>
              <th class="p-4 cursor-pointer">Amount</th>
              <th class="p-4 cursor-pointer">Category</th>
              <th class="p-4 w-1/8 cursor-pointer">Action</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody" class="divide-y divide-gray-300 bg-gray-50 text-sm ">
          </tbody>
        </table>
      </div>
      <div id="transactionPagination" class="pagination-controls flex justify-center items-center mt-4 space-x-4">
      </div>

    </div>


  </div>




  <br class="mt-14">

  <br>

</body>

</html>
