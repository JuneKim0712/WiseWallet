<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>

    <!-- Firebase Imports --> 
    <script defer src="/__/firebase/11.0.1/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/11.0.1/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/11.0.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
    <script defer src="js/login.js"></script>

    <!-- Tailwind Imports -->
    <script defer src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/index.css">

    <!-- Font Imports  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="assets\favicon.svg">

    </head>
    <script >
      document.addEventListener("DOMContentLoaded", async() => {
        document.getElementById("body").classList.remove("hidden")
      })
      
    </script>
    
  <body id="body" class="hidden bg-gray-100 flex flex-col items-center justify-center min-h-screen">

      <!-- Header / Logo -->
      <header class="text-center font-[Montserrat] mt-6">
        <h1 class="text-3xl font-semibold">Wise Wallet</h1>
      </header>
  
      <!-- Sign-In Form Container -->
      <main class="flex justify-center min-h-screen mt-4 font-[Montserrat]">
          <section class="bg-white p-8 rounded-lg shadow-lg w-96">
              <h2 class="text-xl font-semibold mb-4 text-center">Sign In</h2>
  
              <!-- Stay Signed In Toggle -->
              <div class="flex items-center mb-4">
                  <label class="mr-2">Stay signed in</label>
                  <input type="checkbox" class="toggle-checkbox">
              </div>
  
              <!-- Social Sign-In Buttons -->
              <button class="w-full border p-2 mb-2 rounded flex items-center justify-center bg-white text-gray-700 border-black transition-all duration-200 ease-in-out hover:scale-105 hover:border-blue-500 cursor-pointer"><img src="assets/Apple_logo_black.svg" class="h-7 w-6 mb-1  mr-3">Continue with Apple</button>
              <button id="googleSignIn" class="w-full border p-2 mb-4 rounded flex items-center justify-center bg-white text-gray-700 border-black transition-all duration-200 ease-in-out hover:scale-105 hover:border-blue-500 cursor-pointer"><img src="assets/google-icon.svg" class="h-7 w-7 mr-3">Continue with Google</button>
              
              <!-- Divider -->
              <p class="text-center text-gray-500 mb-4">OR</p>
  
              <!-- Email & Password Fields -->
              <form>
                  <label class="block text-gray-700">Email address</label>
                  <input type="email" class="w-full border p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
  
                  <label class="block text-gray-700">Password</label>
                  <input type="password" class="w-full border p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
  
                  <!-- Forgot Password Link -->
                  <div class="text-right mb-4">
                      <a href="#" class="text-blue-500 hover:underline">Forgot Password?</a>
                  </div>
  
                  <!-- Sign-In Button -->
                  <button type="submit" class="w-full bg-orange-500 text-white p-2 rounded hover:bg-orange-600 transition">Sign In</button>
              </form>

  </body>
</html>
