<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goal</title>

  <!-- Firebase Imports -->
  <script defer src="/__/firebase/11.0.1/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/11.0.1/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/11.0.1/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/init.js?useEmulator=true"></script>

  <!-- Javascript Imports-->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" defer src="js/db.js"></script>
  <script type="module" defer src="js/preprocess.js"></script>
  <script type="module" defer src="js/goal.js"></script>

  <!-- Tailwind Imports -->
  <script defer src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/goal.css">

  <!-- Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets\favicon.svg">
</head>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("body").classList.remove("hidden");
    // Add animation class to the container
    document.querySelector('.goals-container').classList.add('animate-in');
  });
</script>

<body id="body" class="hidden bg-[#f8fafc] font-[Montserrat]">
  
  <!-- Navigation Bar -->
  <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-gray-200 p-10 h-16 flex items-center justify-between relative text-sm sm:text-base mt-3 font-semibold">
    <img src="assets/favicon.svg" class="h-15 w-15 transition-transform duration-300 hover:scale-105">
    <div class="flex justify-center flex-1 space-x-14">
      <a class="nav-link" href="home.html">Home</a>
      <a class="nav-link active" href="goal.html">Goal</a>
      <a class="nav-link" href="transactions.html">Transactions</a>
      <a class="nav-link" href="help.html">Support</a>
      <button class="sign-out-btn" id="signOutBtn">
        <a href="">Sign Out</a>
      </button>
    </div>
  </nav>

  <!-- Goals Container -->
  <div class="max-w-6xl mx-auto mt-12 px-6 goals-container">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Financial Goals</h1>
      <div class="flex items-center gap-4">
        <button id="addGoalBtn" class="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all duration-300 transform hover:scale-105 shadow-md hover:shadow-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add Goal
        </button>
        <div class="flex items-center gap-2 text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-sm">Track your progress towards financial milestones</span>
        </div>
      </div>
    </div>
    
    <div id="goalsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Goals will be dynamically inserted here -->
    </div>
  </div>
</body>

</html>
